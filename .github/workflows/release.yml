name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create/publish (e.g. v0.8.1). Leave empty to package only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux package
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            glslc libvulkan-dev libx11-dev python3

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v$(tr -d '[:space:]' < VERSION)"
          fi
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Packaging $TAG ($VER)"
          printf '%s\n' "$VER" > VERSION

      - name: Package Linux
        run: |
          chmod +x scripts/package-xfsr.sh scripts/package-appimage.sh scripts/xfsr-run scripts/edgerun
          ./scripts/package-xfsr.sh

      - name: Package AppImage
        run: |
          # appimagetool needs extract-and-run in CI (no FUSE)
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./scripts/package-appimage.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgescale-${{ steps.ver.outputs.version }}-linux-x86_64
          path: |
            dist/edgescale-${{ steps.ver.outputs.version }}-linux-x86_64.tar.gz
            dist/edgescale-linux-x86_64.tar.gz
            dist/EdgeScale-${{ steps.ver.outputs.version }}-x86_64.AppImage
            dist/EdgeScale-x86_64.AppImage

  build-windows:
    name: Build Windows package
    runs-on: windows-latest
    needs: build-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.296.0
          cache: false

      - name: Build Windows
        shell: cmd
        run: |
          call scripts\build-windows.bat

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $ver = "${{ needs.build-linux.outputs.version }}"
          Compress-Archive -Path "dist\edgescale-windows-x86_64\*" -DestinationPath "dist\edgescale-$ver-windows-x86_64.zip" -Force
          Compress-Archive -Path "dist\edgescale-windows-x86_64\*" -DestinationPath "dist\edgescale-windows-x86_64.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            throw "ISCC.exe not found after Inno Setup install"
          }

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $ver = "${{ needs.build-linux.outputs.version }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$ver" `
            "/DSourceDir=$pwd\dist\edgescale-windows-x86_64" `
            "/DOutputDir=$pwd\dist" `
            "packaging\windows\edgescale.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Copy-Item "dist\EdgeScale-$ver-Setup.exe" "dist\EdgeScale-Setup.exe" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgescale-${{ needs.build-linux.outputs.version }}-windows-x86_64
          path: |
            dist/edgescale-*.zip
            dist/EdgeScale-*-Setup.exe
            dist/EdgeScale-Setup.exe

  publish-release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' || inputs.tag != ''
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: edgescale-${{ needs.build-linux.outputs.version }}-linux-x86_64
          path: dist

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: edgescale-${{ needs.build-linux.outputs.version }}-windows-x86_64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-linux.outputs.tag }}
          name: EdgeScale ${{ needs.build-linux.outputs.version }}
          body_path: CHANGELOG.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.AppImage
            dist/*-Setup.exe
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
