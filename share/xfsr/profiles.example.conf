# xfsr per-game profiles (example / shipped defaults)
#
# Install copy:  ~/.config/xfsr/profiles.conf
# Lookup order: SteamAppId → SteamGameId → exe basename → exe_contains
# First matching section wins. Explicit CLI flags always override the profile.
#
# Section headers:
#   [app:730]           Steam AppID
#   [exe:cs2]           basename of argv0 / %command% (lowercase)
#   [contains:iw3sp]    substring match on the command line
#
# Keys (all optional):
#   preset=quality|balanced|performance|ultra
#   output=WxH              display / present size (e.g. 3840x2160)
#   render=WxH              absolute internal render size (overrides preset scale)
#   fsr=1|0|blit|native     (0/blit = linear upscale; native = passthrough)
#   upscaler=fsr1|blit|nearest|nis|edge  (nearest = pixel art; edge used by --hybrid)
#   rcas=0|1
#   edge_mode=quality|perf  (EdgePass; perf = lite path)
#   lod_bias=auto|off|<float>  (sampler mip LOD; auto = -log2(scale))
#   lod_bias_offset=<float>
#   edge_sharpness=0..1     (EdgePass post-scale sharpen)
#   offload=0|1
#   hybrid=0|1              implies offload+one-way+edge (xfsr-run --hybrid)
#   one_way=0|1|force
#   caps_shrink=0|1
#   overlay=0|1
#   zink=0|1|auto
#   wow64=1                 (log hint: set PROTON_USE_WOW64=1)
#   adaptive=0|1            continuous adaptive scale (XFSR_ADAPTIVE)
#   target_fps=60           adaptive target
#   gamescope=0|1           nest in gamescope (nested=preset render → output)
#   gamescope_fs=0|1        gamescope host fullscreen (-f); game still at nest size
#   gamescope_filter=fsr|nis|linear|nearest|sgsr
#   note=...                (printed at launch)
#
# Peak FPS when the layer engages: same-GPU + blit|nis|edge + ultra.
# Titles that ignore caps shrink (CS2, Village, many DXVK): use gamescope=1
# (xfsr-run --any). On NVIDIA the wrapper picks --backend sdl automatically.

# Counter-Strike 2 — Vulkan layer + iGPU offload
[app:730]
preset=ultra
upscaler=edge
edge_mode=perf
rcas=0
offload=1
gamescope=0
caps_shrink=1
overlay=1
note=CS2: Vulkan layer + iGPU offload (preset: ultra)

# Call of Duty 4: Modern Warfare (2007) — direct Vulkan layer upscaling + caps shrink + Wow64 + iGPU offload.
[app:7940]
preset=performance
upscaler=edge
edge_mode=quality
edge_sharpness=0.60
rcas=0
offload=1
gamescope=0
caps_shrink=1
overlay=1
wow64=1
note=CoD4: direct layer upscaling + iGPU offload (preset: performance = 960x540 → 1920x1080)

[contains:iw3sp]
preset=performance
upscaler=edge
edge_mode=quality
edge_sharpness=0.60
