# EdgeScale per-game profiles
#
# Install copy:  ~/.config/edgescale/profiles.conf (or ~/.config/xfsr/profiles.conf)
# Lookup order: SteamAppId → SteamGameId → exe basename → exe_contains
# First matching section wins. Explicit CLI flags always override the profile.
#
# Section headers:
#   [app:730]           Steam AppID
#   [exe:cs2]           basename of argv0 / %command% (lowercase)
#   [contains:iw3sp]    substring match on the command line
#
# Keys (all optional):
#   preset=quality|balanced|performance|ultra
#   fsr=1|0|blit|native     (0/blit = linear upscale; native = passthrough)
#   upscaler=edge|fsr1|nis|blit|nearest  (default: edge)
#   rcas=0|1
#   edge_mode=quality|perf|nearest       (default: quality; nearest = 2D pixel art)
#   lod_bias=auto|off|<float>            (sampler mip LOD; auto = -log2(scale))
#   lod_bias_offset=<float>
#   edge_sharpness=0..1                  (EdgePass post-scale sharpen; default: 0.60)
#   offload=0|1                          (dual-GPU offload to companion iGPU; 0 = same-GPU)
#   hybrid=0|1                           (implies offload+one-way+edge)
#   one_way=0|1|force                    (direct one-way iGPU presentation)
#   caps_shrink=0|1                      (surface capability shrinking; 1 = enabled)
#   overlay=0|1                          (HUD status strip)
#   zink=0|1|auto                        (Mesa Zink for OpenGL titles)
#   wow64=1                              (log hint: set PROTON_USE_WOW64=1)
#   adaptive=0|1                         (continuous adaptive scale toward target_fps)
#   target_fps=60                        (adaptive target FPS)
#   spoof_vram=8GB|12GB|auto             (spoof VRAM heap size to unlock higher textures)
#   dsr=4k|1440p|<val>                   (supersampling downsample mode: render 4K on 1080p display)
#   gamescope=0|1                        (nest in gamescope)
#   gamescope_fs=0|1                     (gamescope host fullscreen)
#   gamescope_filter=fsr|nis|linear|nearest|sgsr
#   note=...                             (printed at launch)
#
# Add your custom game sections below. Example:
# [app:12345]
# preset=quality
# upscaler=edge
# offload=0
